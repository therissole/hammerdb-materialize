services:
  mssql:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: hmdb-mssql
    profiles:
      - mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_AGENT_ENABLED: "true"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/localhost/1433'"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mssqldata:/var/opt/mssql
      - ./scripts:/work/scripts:ro

  postgres:
    image: postgres
    container_name: hmdb-postgres
    profiles:
      - pgsql
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tpcc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=20
      - -c
      - max_replication_slots=20
      - -c
      - shared_preload_libraries=pg_stat_statements
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tpcc}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./scripts:/work/scripts:ro

  materialized:
    image: ${MATERIALIZED_IMAGE:-materialize/materialized:latest}
    container_name: hmdb-materialized
    restart: unless-stopped
    ports:
      - "6874:6874"
      - "${MATERIALIZE_SQL_PORT:-6875}:6875"
      - "6876:6876"
    volumes:
      - ./scripts:/work/scripts:ro

  hammerdb:
    image: ${HAMMERDB_IMAGE:-tpcorg/hammerdb:latest}
    container_name: hmdb-hammerdb
    restart: unless-stopped
    working_dir: /work
    command: ["bash", "-lc", "sleep infinity"]
    ports:
      - "8085:8080"   # hammerdbws web UI (container 8080) -> http://localhost:8085
    environment:
      TMP: /work/tmp
      RDBMS: ${RDBMS:-PGSQL}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tpcc}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PG_SSLMODE: ${PG_SSLMODE:-prefer}
      MSSQL_HOST: ${MSSQL_HOST:-mssql}
      MSSQL_PORT: ${MSSQL_PORT:-1433}
      MSSQL_DB: ${MSSQL_DB:-tpcc}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}
      TPCC_USER: ${TPCC_USER:-tpcc}
      TPCC_PASS: ${TPCC_PASS:-tpcc}
      TPROC_C_WAREHOUSES: ${TPROC_C_WAREHOUSES:-}
      TPROC_C_VU: ${TPROC_C_VU:-}
      TPROC_C_RAMPUP: ${TPROC_C_RAMPUP:-2}
      TPROC_C_DURATION: ${TPROC_C_DURATION:-5}
      TPROC_C_ALLWAREHOUSE: ${TPROC_C_ALLWAREHOUSE:-true}
      PROFILEID: ${TPROC_C_PROFILEID:-0}
      UAW: ${TPROC_C_UAW:-0}
    volumes:
      - ./:/work

  locust:
    build:
      context: ./locust
    container_name: hmdb-locust
    profiles:
      - locust
    restart: unless-stopped
    depends_on:
      - materialized
    ports:
      - "8089:8089"
    environment:
      MATERIALIZE_HOST: ${MATERIALIZE_HOST:-materialized}
      MATERIALIZE_PORT: ${MATERIALIZE_SQL_PORT:-6875}
      MATERIALIZE_DATABASE: ${MATERIALIZE_DB:-materialize}
      MATERIALIZE_USER: ${MATERIALIZE_USER:-materialize}
      MATERIALIZE_PASSWORD: ${MATERIALIZE_PASSWORD:-}
      MATERIALIZE_SSLMODE: ${MATERIALIZE_SSLMODE:-disable}
      LOCUST_CUSTOMER_POOL_SIZE: ${LOCUST_CUSTOMER_POOL_SIZE:-1000}
      LOCUST_RECENT_ORDERS_LIMIT: ${LOCUST_RECENT_ORDERS_LIMIT:-5}
      LOCUST_MIN_WAIT_SECONDS: ${LOCUST_MIN_WAIT_SECONDS:-0.2}
      LOCUST_MAX_WAIT_SECONDS: ${LOCUST_MAX_WAIT_SECONDS:-2.0}
    volumes:
      - ./locust:/app
    command: ["locust", "-f", "/app/locustfile.py", "--web-host", "0.0.0.0"]

volumes:
  mssqldata:
  pgdata:
