apiVersion: batch/v1
kind: Job
metadata:
  name: hammerdb-phase2
  namespace: sql-server
  labels:
    app: hammerdb
    phase: "2"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: hammerdb
        phase: "2"
    spec:
      restartPolicy: Never
      nodeSelector:
        agentpool: sqlx64
      containers:
        - name: hammerdb
          image: tpcorg/hammerdb:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc", "/work/runner/run-phase2.sh"]
          env:
            - name: TMP
              value: /work/tmp
            - name: HAMMERDB_PHASE2_MODE
              value: build-check-run
            - name: HAMMERDB_CLI
              value: /home/HammerDB-5.0/hammerdbcli
            - name: MSSQL_HOST
              value: mssql.sql-server.svc.cluster.local
            - name: MSSQL_PORT
              value: "1433"
            - name: MSSQL_DB
              value: tpcc
            - name: MSSQL_USER
              value: sa
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mssql-sa-password
                  key: MSSQL_SA_PASSWORD
            - name: MSSQL_USE_BCP
              value: "true"
            - name: TPROC_C_WAREHOUSES
              value: "2"
            - name: TPROC_C_VU
              value: "1"
            - name: TPROC_C_RAMPUP
              value: "2"
            - name: TPROC_C_DURATION
              value: "5"
            - name: TPROC_C_ALLWAREHOUSE
              value: "false"
            - name: PROFILEID
              value: "0"
          volumeMounts:
            - name: runner
              mountPath: /work/runner
              readOnly: true
            - name: custom-scripts
              mountPath: /work/scripts/hammerdb/custom
              readOnly: true
            - name: tmp
              mountPath: /work/tmp
      volumes:
        - name: runner
          configMap:
            name: hammerdb-phase2-runner
            defaultMode: 0555
        - name: custom-scripts
          configMap:
            name: hammerdb-phase2-custom-scripts
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
